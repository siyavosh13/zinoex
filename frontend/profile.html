<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Profile</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-gray-100 font-sans">
    <!-- Navbar -->
    <nav class="bg-white shadow-md">
      <div
        class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center"
      >
        <h1 class="text-xl font-bold text-indigo-700">My Platform</h1>
        <a href="/dashboard.html" class="text-gray-700 hover:text-indigo-600"
          >Dashboard</a
        >
      </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-6xl mx-auto py-10 px-4">
      <!-- Profile Header -->
      <div
        class="bg-white shadow-lg rounded-2xl p-8 mb-10 flex flex-col md:flex-row items-center md:items-start gap-8"
      >
        <img
          src="https://www.w3schools.com/howto/img_avatar.png"
          alt="User Avatar"
          class="w-32 h-32 rounded-full shadow-md"
        />

        <div>
          <h2 id="profile_name" class="text-3xl font-bold text-gray-800 mb-1">
            John Doe
          </h2>
          <p id="email_display" class="text-gray-600 mb-2">
            john.doe@example.com
          </p>

          <span
            id="profile_plan"
            class="px-3 py-1 bg-gradient-to-r from-indigo-500 to-purple-500 text-white text-xs font-bold rounded-full"
          >
            Pro Member
          </span>
        </div>
      </div>

      <!-- Tabs -->
      <div class="bg-white shadow-lg rounded-2xl p-6">
        <div class="border-b-2 border-gray-200 flex space-x-8 mb-6">
          <button
            class="text-indigo-600 font-semibold border-b-2 border-indigo-600 pb-2"
          >
            Account Settings
          </button>
          <button class="text-gray-500 hover:text-indigo-600 pb-2">
            Security
          </button>
        </div>

        <!-- Account Settings -->
        <div class="space-y-8">
          <form id="profile_form" class="space-y-6">
            <div class="grid md:grid-cols-2 gap-6">
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2"
                  >First Name</label
                >
                <input
                  id="first_name"
                  type="text"
                  value="John"
                  class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                />
              </div>

              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2"
                  >Last Name</label
                >
                <input
                  id="last_name"
                  type="text"
                  value="Doe"
                  class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                />
              </div>
            </div>

            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-2"
                >Username</label
              >
              <input
                id="username"
                type="text"
                value="johndoe"
                class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
              />
            </div>

            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-2"
                >Email Address</label
              >
              <div class="relative">
                <input
                  id="email"
                  type="email"
                  value="john.doe@example.com"
                  readonly
                  class="w-full px-4 py-3 pr-12 border-2 border-gray-200 bg-gray-50 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                />
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="absolute right-4 top-3 h-6 w-6 text-gray-400"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M16 12A4 4 0 118 12a4 4 0 018 0z"
                  />
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M12 14v7m-4-4h8"
                  />
                </svg>
              </div>
            </div>

            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-2"
                >Phone Number (Optional)</label
              >
              <input
                id="phone"
                type="tel"
                class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
              />
            </div>

            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-2"
                >Company Name (Optional)</label
              >
              <input
                id="company"
                type="text"
                class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
              />
            </div>

            <div class="flex justify-end">
              <button
                type="submit"
                class="bg-indigo-600 text-white px-6 py-3 rounded-xl font-semibold hover:bg-indigo-700 transition-all"
              >
                Save Changes
              </button>
            </div>
          </form>
        </div>

        <!-- Divider -->
        <hr class="my-10 border-gray-300" />

        <!-- Password Change Form -->
        <div class="space-y-8">
          <h3 class="text-2xl font-semibold text-gray-800">Change Password</h3>

          <form id="password_form" class="space-y-6">
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-2"
                >Current Password</label
              >
              <input
                id="current_password"
                type="password"
                class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
              />
            </div>

            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-2"
                >New Password</label
              >
              <input
                id="new_password"
                type="password"
                class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
              />
            </div>

            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-2"
                >Confirm New Password</label
              >
              <input
                type="password"
                class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
              />
            </div>

            <div class="flex justify-end">
              <button
                type="submit"
                class="bg-indigo-600 text-white px-6 py-3 rounded-xl font-semibold hover:bg-indigo-700 transition-all"
              >
                Update Password
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <script src="profile.js"></script>
  </body>
</html>
